version: 2

snapshots:
  - name: dim_connection
    description: >
      SCD Type 2 dimension of connections. One row per connection per version
      of (company, position). `dbt_valid_to is null` means the row is current;
      a row closed by `hard_deletes='invalidate'` means the connection was
      absent from the latest export — with no reason recorded, deliberately.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - connection_id
              - dbt_valid_from
    columns:
      - name: connection_id
        description: LinkedIn profile URL, percent-encoded — the natural key.
        data_tests:
          - not_null
      - name: company
        description: Employer at the time this version was captured.
      - name: position
        description: Job title at the time this version was captured.
      - name: email_address
        description: Opt-in only — intentionally untested for not_null.
      - name: dbt_scd_id
        description: dbt-generated surrogate key of this version.
        data_tests:
          - unique
          - not_null
      - name: dbt_valid_from
        description: When this version of the connection became current.
        data_tests:
          - not_null
      - name: dbt_valid_to
        description: When this version stopped being current; NULL while current.
